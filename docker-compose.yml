version: "3.8"

services:
  phytoai-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phytoai-plant-disease-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models
      - ./data/sample_images:/app/data/sample_images
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
